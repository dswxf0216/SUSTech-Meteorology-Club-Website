services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-club_website}
      POSTGRES_USER: ${POSTGRES_USER:-club_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-club_user} -d ${POSTGRES_DB:-club_website}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
